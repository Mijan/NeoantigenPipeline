mhc_i:
  alleles: ["HLA-A*29:02", "HLA-B*45:01", "HLA-B*82:02", "HLA-C*06:02"]
  peptide_lengths: [8, 9, 10, 11]
  use_presentation_score: true
  binding_affinity_threshold_nm: 500.0
  percentile_rank_threshold: 2.0

peptide_generation:
  peptide_lengths: [8, 9, 10, 11]
  n_flank_length: 10
  c_flank_length: 10

expression_filter:
  min_expression: 1.0
  filter_missing: false

scoring:
  presentation_score_weight: 0.4
  agretopicity_weight: 0.2
  expression_weight: 0.2
  vaf_weight: 0.2

hlapollo:
  binary_path: "tools/HLApollo/HLA-Apollo"
  docker_image: "hla-apollo"
  timeout_seconds: 3600
  batch_size: 5000
  enabled: false

esm:
  model_name: "esm2_t33_650M_UR50D"
  cache_path: "results/esm_cache.h5"
  device: "auto"
  batch_size: 4
  context_window: 15
  enabled: false

output_dir: "results"
